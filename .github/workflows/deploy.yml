name: Deploy to AWS EC2 with Docker

on:
  push:
    branches:
      - backend # You can change this to any branch you want to trigger the deployment

jobs:
  deploy:
    runs-on: ubuntu-latest # Runs on GitHub-hosted Ubuntu environment

    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }} # Store your Docker Hub username in GitHub secrets
          password: ${{ secrets.DOCKER_PASSWORD }} # Store your Docker Hub password in GitHub secrets

      - name: Build and push Docker image to Docker Hub
        working-directory: ./backend
        run: |
          docker build -t rahee049/repo-reelforge .
          docker push rahee049/repo-reelforge

      - name: Set up SSH key for EC2 access
        run: echo "${{ secrets.EC2_SSH_KEY }}" | base64 --decode > private-key.pem
        continue-on-error: true

      - name: Set EC2 permissions for SSH key
        run: chmod 600 private-key.pem

      - name: Deploy Docker image to EC2
        run: |
          ssh -i private-key.pem -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} <<EOF
            docker pull rahee049/repo-reelforge
            docker stop dazzling_knuth || true
            docker rm dazzling_knuth || true
            sudo docker run -d -p 3000:3000 --env-file .env rahee049/repo-reelforge
          EOF